<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your interview</title>
    <link rel="stylesheet" href="/dist/styles.css" />
  </head>
  <body>
    <p class="banner">Synthetic data only. This page is one candidate, not the hirer chat.</p>
    <main>
      <section>
        <h1>Avery</h1>
        <p id="live" aria-live="polite">Signing in.</p>
        <button id="sign-candidate" type="button" hidden>Sign in with Google</button>
        <p>You can accept or decline your own interview. You cannot approve a hire or open another candidate.</p>
        <button id="accept" type="button" disabled>Accept interview</button>
        <button id="decline" type="button" disabled>Decline interview</button>
        <p><a href="/">Hirer chat</a></p>
      </section>
    </main>
    <script type="module" src="/dist/interview.js"></script>
  </body>
</html>
