services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENV: local
      AGENTS_URL: http://agents:8090
      WEB_DIR: /web
      PORT: "8080"
    depends_on:
      - agents

  agents:
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      TRACE_PATH: /tmp/traces.jsonl

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      ENV: local

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080"]
    ports:
      - "8086:8080"

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085"]
    ports:
      - "8085:8085"

  otel:
    image: otel/opentelemetry-collector:0.128.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
