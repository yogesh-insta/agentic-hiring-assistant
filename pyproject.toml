[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-hiring-assistant"
version = "0.1.0"
description = "Hiring product for a small-business hirer."
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2,<3",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agents*", "guardrails*", "worker*", "services*", "tools*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["agents", "guardrails", "worker", "services"]
pythonpath = ["."]
